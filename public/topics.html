<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选题库 · 出海内容素材雷达</title>
  <style>
:root {
  --bg: #f5f7f8;
  --ink: #172026;
  --muted: #64727a;
  --panel: #ffffff;
  --line: #dce4e8;
  --green: #0f766e;
  --green-soft: rgba(15, 118, 110, .1);
  --blue: #285f95;
  --amber: #b45309;
  --amber-soft: rgba(180, 83, 9, .1);
  --shadow: 0 18px 46px rgba(18, 30, 38, .1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: linear-gradient(180deg, #e9eef1 0, var(--bg) 360px);
  color: var(--ink);
  font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  line-height: 1.55;
}

a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }

.topbar {
  width: min(1180px, calc(100% - 40px));
  min-height: 74px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
}

.brand .logo {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--ink);
  color: #fff;
  font-size: 12px;
}

nav { display: flex; gap: 16px; color: var(--muted); font-size: 14px; }
nav a:hover { color: var(--ink); }

main {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto 58px;
}

.hero {
  padding: 40px 44px;
  border-radius: 10px;
  background:
    linear-gradient(135deg, rgba(15, 118, 110, .16), transparent 46%),
    var(--ink);
  color: #fff;
  box-shadow: var(--shadow);
}

.hero .eyebrow { color: #7fd1c8; }

.eyebrow {
  margin: 0 0 10px;
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.hero h1 {
  font-size: clamp(34px, 5vw, 52px);
  line-height: 1.08;
}

.hero p.lead {
  max-width: 640px;
  margin-top: 14px;
  color: rgba(255, 255, 255, .82);
  font-size: 16px;
}

.niche-line {
  margin-top: 18px;
  font-size: 13px;
  color: rgba(255, 255, 255, .66);
}

.setup-banner {
  margin-top: 16px;
  padding: 16px 20px;
  border: 1px dashed var(--amber);
  border-radius: 10px;
  background: var(--amber-soft);
  color: #7c4a03;
  font-size: 14px;
}

.setup-banner strong { display: block; margin-bottom: 4px; }
.setup-banner code {
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, .7);
  font-size: 13px;
}

.stats-band {
  margin: 20px 0 8px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.stats-band div {
  padding: 20px;
  border-left: 1px solid var(--line);
}

.stats-band div:first-child { border-left: 0; }
.stats-band strong { font-size: 28px; line-height: 1; display: block; }
.stats-band span { margin-top: 6px; color: var(--muted); font-size: 13px; display: block; }

.section { margin-top: 34px; }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}

.section-head h2 { font-size: 26px; line-height: 1.15; }
.section-head p { color: var(--muted); font-size: 13px; }

.card-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.card {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  box-shadow: var(--shadow);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12px;
}

.tag {
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--green-soft);
  color: var(--green);
  font-weight: 800;
}

.tag.plain {
  background: rgba(15, 23, 42, .07);
  color: var(--muted);
  font-weight: 700;
}

.card h3 { font-size: 18px; line-height: 1.32; }
.card .copy { color: var(--muted); font-size: 14px; }

.quote {
  margin: 0;
  padding: 12px 14px;
  border-left: 4px solid var(--green);
  border-radius: 0 8px 8px 0;
  background: #f4f8f8;
  color: #31424b;
  font-size: 14px;
}

.takeaway {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: #31424b;
}

.takeaway strong { color: var(--ink); }

.card-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: 12px;
}

.card-foot a { color: var(--blue); font-weight: 800; white-space: nowrap; }

.trend-list { display: grid; gap: 12px; }

.trend-row {
  display: grid;
  grid-template-columns: minmax(140px, 220px) 72px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
  padding: 16px 20px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  box-shadow: var(--shadow);
}

.trend-row .kw { font-weight: 800; font-size: 16px; word-break: break-all; }

.signal {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  text-align: center;
}

.signal-up { background: var(--green-soft); color: var(--green); }
.signal-hot { background: var(--amber-soft); color: var(--amber); }
.signal-down { background: rgba(15, 23, 42, .07); color: var(--muted); }

.trend-row .evidence { color: var(--muted); font-size: 14px; }
.trend-row .suggestion { margin-top: 6px; font-size: 14px; color: #31424b; }
.trend-row a { color: var(--blue); font-weight: 800; font-size: 13px; }

.empty-block {
  grid-column: 1 / -1;
  padding: 28px;
  border: 1px dashed var(--line);
  border-radius: 10px;
  background: var(--panel);
  color: var(--muted);
  font-size: 14px;
}

.empty-block strong { color: var(--ink); display: block; margin-bottom: 6px; font-size: 16px; }
.empty-block code {
  padding: 1px 6px;
  border-radius: 4px;
  background: #eef2f4;
  font-size: 13px;
}

.topic-group { margin-top: 22px; }
.topic-group h3 { font-size: 18px; margin-bottom: 10px; }
.topic-group h3 span { color: var(--muted); font-size: 13px; font-weight: 400; margin-left: 8px; }

.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 8px;
  vertical-align: middle;
}

.status-0 { background: var(--amber); }
.status-1 { background: var(--blue); }
.status-2 { background: var(--green); }
.status-3 { background: var(--muted); }

.archive-row {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr);
  gap: 16px;
  padding: 14px 0;
  border-top: 1px solid var(--line);
}

.archive-row .date { color: var(--green); font-weight: 800; font-size: 14px; }
.archive-row h3 { font-size: 16px; }
.archive-row p { margin-top: 6px; color: var(--muted); font-size: 14px; }
.archive-row a { display: inline-flex; margin-top: 8px; color: var(--blue); font-weight: 800; font-size: 13px; }

.panel {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  box-shadow: var(--shadow);
  padding: 26px;
}

footer {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto 36px;
  color: var(--muted);
  font-size: 13px;
}

@media (max-width: 860px) {
  .card-grid { grid-template-columns: 1fr; }
  .stats-band { grid-template-columns: repeat(2, 1fr); }
  .stats-band div:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
  .stats-band div:nth-child(4) { border-top: 1px solid var(--line); }
  .trend-row { grid-template-columns: 1fr; gap: 8px; }
}

@media (max-width: 680px) {
  .topbar, main, footer { width: min(100% - 28px, 1180px); }
  .topbar { padding: 18px 0 8px; align-items: flex-start; flex-direction: column; }
  nav { width: 100%; justify-content: space-between; }
  .hero { padding: 28px 24px; }
}
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="logo">SC</span>选题库 · 出海内容素材雷达</a>
    <nav><a href="./">今日素材</a><a href="archive.html">沉淀库</a></nav>
  </header>
  <main>

    <section class="hero">
      <p class="eyebrow">Topic Pipeline</p>
      <h1>选题库</h1>
      <p class="lead">素材只有变成选题并排期，才会变成发布的内容。按状态推进：待做 → 进行中 → 已发布 → 已验证。</p>
    </section>
    
        <div class="empty-block">
          <strong>选题库还是空的</strong>
          在「今日素材」里看到可用的角度后，让 AI 助手把它登记进 <code>content/topics.json</code>：标题、来源素材、排期和状态（待做/进行中/已发布/已验证）。
        </div>
    <footer style="width:100%;margin-top:36px;">页面生成：2026-08-05 14:41 Asia/Shanghai。</footer>

  </main>
</body>
</html>
