name: Daily Brand Global News

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate site
        run: python scripts/generate_site.py

      - name: Verify materials report
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          report = json.loads(Path("content/materials.json").read_text(encoding="utf-8"))
          today = datetime.now(timezone(timedelta(hours=8))).date()
          report_day = datetime.strptime(report["report_date"], "%Y-%m-%d").date()
          age = (today - report_day).days
          assert 0 <= age <= 7, (
              f"report date {report['report_date']!r} is {age} day(s) from Beijing date {today}; "
              "reports older than 7 days are treated as stale"
          )
          for key in ("competitor_ads", "pain_points", "trends"):
              assert isinstance(report.get(key, []), list), f"{key} must be a list"
          if age:
              print(f"warning: republishing {age}-day-old report with latest template")
          total = sum(len(report.get(k, [])) for k in ("competitor_ads", "pain_points", "trends"))
          print(f"publishing {report['report_date']} with {total} materials")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
