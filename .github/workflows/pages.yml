name: Guoxue Content and Compliance Radar

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Beijing time 08:15 and 20:15 (UTC 00:15 and 12:15)
    - cron: "15 0,12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public platform signals
        run: python scripts/collect_sources.py

      - name: Monitor official platform policies
        run: python scripts/collect_policies.py

      - name: Generate site
        run: python scripts/generate_site.py

      - name: Verify generated pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("content/materials.json").read_text(encoding="utf-8"))
          assert isinstance(report.get("items"), list), "items must be a list"
          policies = json.loads(Path("content/policies.json").read_text(encoding="utf-8"))
          assert isinstance(policies.get("policies"), list), "policies must be a list"
          for page in ("index.html", "compliance.html", "sources.html", "topics.html", "archive.html"):
              path = Path("public") / page
              assert path.exists() and path.stat().st_size > 500, f"missing or empty: {page}"
          print(f"publishing {report['report_date']} with {len(report['items'])} items and {len(policies['policies'])} policy sources")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
