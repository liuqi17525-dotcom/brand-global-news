name: Daily Brand Global News

on:
  push:
    branches:
      - main
  schedule:
    - cron: "45 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate site
        run: python scripts/generate_site.py

      - name: Verify curated report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("content/latest.json").read_text(encoding="utf-8"))
          assert report.get("report_date"), "missing report_date"
          assert report.get("items"), "report has no verified items"
          print(f"publishing {report['report_date']} with {len(report['items'])} verified items")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
